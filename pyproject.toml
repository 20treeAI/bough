[project]
name = "bough"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "packaging>=21.0", "gitpython>=3.1.0"]

[project.scripts]
bough = "bough.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ipdb>=0.13.13", "pytest>=8.4.1", "tomli-w>=1.0.0"]
