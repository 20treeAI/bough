[project]
name = "bough"
dynamic = ["version"]
description = "bough is a tool to determine which uv workspace packages need rebuilding based on git changes"
authors = [
  {name = "Andrew Nichols", email = "andrew.nichols@overstory.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "packaging>=21.0", "gitpython>=3.1.0"]

[project.scripts]
bough = "bough.cli:main"

[project.urls]
Repository = "https://github.com/20treeAI/bough.git"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest>=8.4.1",
    "ruff>=0.12.11",
    "tomli-w>=1.0.0",
    "ty>=0.0.1a25",
]

[tool.ruff]
exclude = ["tests/fixtures/sample-workspace/**/*.py"]

[tool.ruff.lint]
# select = ["ALL"]
# select = ["F", "B", "ANN", "D", "E"]
select = ["F", "B", "E", "I", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["S101", "D"]

[tool.ty.src]
include = ["bough", "tests"]
exclude = ["tests/fixtures/sample-workspace/**/*.py"]
